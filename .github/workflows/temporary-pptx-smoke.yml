name: Temporary PowerPoint export smoke test
on:
  push:
    branches: [feature/presentation-preview-editor-20261013]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PowerPoint runtime for smoke test
        run: npm install --prefix /tmp/pptx --no-save --no-audit --no-fund pptxgenjs@3.12.0
      - name: Generate real PPTX
        run: |
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          import {seedRoadmap} from './dist/model.mjs';
          import {buildRoadmapDeck} from './dist/deck-model.mjs';
          import {createPowerPoint} from './dist/deck-export.mjs';
          const require=createRequire(import.meta.url);
          const Pptx=require('/tmp/pptx/node_modules/pptxgenjs');
          const model=buildRoadmapDeck(seedRoadmap(),{includeDeepDives:true});
          model.slides[0].notes='Presentation speaker notes smoke test';
          const pptx=createPowerPoint(model,Pptx);
          await pptx.writeFile({fileName:'/tmp/roadmap-smoke.pptx'});
          console.log('Exported '+pptx._slides.length+' slides');
          JS
          python3 - <<'PY'
          import zipfile,os
          p='/tmp/roadmap-smoke.pptx'
          with zipfile.ZipFile(p) as z:
              slides=[n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
              print('PowerPoint valid ZIP with',len(slides),'slide XML parts, size',os.path.getsize(p))
              assert len(slides)>20
          PY
      - name: Verify browser library URL
        run: curl -fIL --max-time 25 https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install headless browser
        run: |
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Preview, edit and download from the browser
        run: |
          npm run build
          node scripts/serve.mjs >/tmp/roadmaps-server.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          import {stat} from 'node:fs/promises';
          const require=createRequire(import.meta.url);
          const {chromium}=require('/tmp/pw/node_modules/playwright');
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({acceptDownloads:true,viewport:{width:1440,height:900}});
          page.on('pageerror',error=>console.log('PAGE ERROR:',error.message));
          await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});
          await page.locator('#presentation-preview').waitFor({state:'visible',timeout:30000});
          await page.locator('#presentation-preview').click();
          await page.waitForURL(/deck\.html/,{timeout:15000});
          await page.locator('.deck-list-item').first().waitFor({timeout:15000});
          const count=await page.locator('.deck-list-item').count();
          if(count<20)throw Error('Expected 20+ slides; got '+count);
          await page.locator('[data-field="title"]').fill('Steering group roadmap');
          const previewTitle=await page.locator('.deck-slide h2').innerText();
          if(previewTitle!=='Steering group roadmap')throw Error('Preview not updated: '+previewTitle);
          await page.locator('#deck-next').click();
          await page.locator('#deck-prev').click();
          const promise=page.waitForEvent('download',{timeout:120000});
          await page.locator('#deck-export-pptx').click();
          const download=await promise;
          const file=await download.path();
          const bytes=(await stat(file)).size;
          console.log('BROWSER SUCCESS: '+count+' slides, edited title, PowerPoint '+download.suggestedFilename()+' '+bytes+' bytes');
          if(bytes<10000)throw Error('Downloaded PowerPoint too small');
          await browser.close();
          JS
