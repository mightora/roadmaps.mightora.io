name: Temporary navigation browser smoke
on:
  push:
    branches: [feature/compact-manage-navigation-20261013]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install headless browser
        run: |
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify desktop and mobile workspace navigation
        run: |
          npm run build
          node scripts/serve.mjs >/tmp/roadmaps-server.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url);
          const {chromium}=require('/tmp/pw/node_modules/playwright');
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          page.on('pageerror',e=>console.log('PAGE ERROR',e.message));
          await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});
          await page.locator('#workspace-menu-toggle').waitFor({state:'visible',timeout:30000});
          if(await page.locator('aside.sidebar').count())throw Error('Old sidebar remains');
          const box=await page.locator('#workspace').boundingBox();
          if(box.x>3||box.width<1400)throw Error('Roadmap did not expand to full width '+JSON.stringify(box));
          const go=async(pageId,heading)=>{
            await page.locator('#workspace-menu-toggle').click();
            await page.locator('#workspace-menu [data-page="'+pageId+'"]').click();
            await page.locator('#workspace-panel h1').waitFor({state:'visible',timeout:10000});
            const title=await page.locator('#workspace-panel h1').innerText();
            if(!title.includes(heading))throw Error(pageId+' heading was '+title);
            if(await page.locator('.workspace-menu-wrap').getAttribute('open')!==null)throw Error('Menu did not close after '+pageId);
            await page.locator('#workspace-return').click();
            await page.locator('#roadmap-content').waitFor({state:'visible'});
          };
          await go('library','Your roadmap library');
          await go('workstreams','Workstreams');
          await go('portfolio','Portfolio & reports');
          await go('data','Data backup');
          await page.locator('#workspace-menu-toggle').click();
          await page.locator('#settings').click();
          if(!await page.locator('#settings-dialog').evaluate(el=>el.open))throw Error('Roadmap settings did not open');
          await page.locator('#settings-dialog').evaluate(el=>el.close());
          await page.locator('#workspace-menu-toggle').click();
          await page.keyboard.press('Escape');
          if(await page.locator('.workspace-menu-wrap').getAttribute('open')!==null)throw Error('Escape did not close menu');
          await page.locator('.view-tabs [data-view="dependencies"]').click();
          if(!await page.locator('.view-tabs [data-view="dependencies"]').evaluate(el=>el.classList.contains('active')))throw Error('Dependencies tab not active');
          await page.setViewportSize({width:390,height:844});
          await page.locator('#workspace-menu-toggle').click();
          const m=await page.locator('#workspace-menu').boundingBox();
          if(m.x<0||m.x+m.width>392)throw Error('Mobile Manage menu outside viewport '+JSON.stringify(m));
          await page.locator('#workspace-menu [data-view="roadmap"]').click();
          const mobile=await page.locator('#workspace').boundingBox();
          if(mobile.x>3||mobile.width<385)throw Error('Mobile editor not full width '+JSON.stringify(mobile));
          console.log('NAVIGATION SUCCESS: desktop full width, 4 utility pages, back navigation, settings, tabs, Escape and mobile menu');
          await browser.close();
          JS
