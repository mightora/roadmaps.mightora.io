name: Diagnose CodeQL PR 12 alert
on:
  push:
    branches: [feature/trust-badges-branded-icons-20261013]
permissions:
  contents: read
  checks: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CodeQL annotation location
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/check-runs/115187122986/annotations --jq '.[] | "File: \(.path) | Line: \(.start_line) | Rule: \(.title) | Summary: \(.message)"'
